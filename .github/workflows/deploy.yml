name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Bundles src/canvass into public/private-.../index.html, injecting the
      # sync endpoint and token from secrets. Must run BEFORE the Astro build,
      # which copies public/ into the site. Missing secrets are a warning.
      - name: Build canvassing bundle
        env:
          CANVASS_SCRIPT_URL: ${{ secrets.CANVASS_SCRIPT_URL }}
          CANVASS_TOKEN: ${{ secrets.CANVASS_TOKEN }}
        run: node scripts/build-canvass.mjs

      - name: Build Astro site
        uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: pnpm@9.15.9

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
