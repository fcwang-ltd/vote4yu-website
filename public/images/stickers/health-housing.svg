  <rect x="12" y="12" width="144" height="164" rx="30" stroke="#ff8a3d" stroke-width="3.2"/>
  <rect x="20" y="20" width="128" height="148" rx="24" stroke="#ff8a3d" stroke-width="1.15" opacity="0.32"/>
