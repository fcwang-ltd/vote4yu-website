  <path d="M106 66 H114" stroke="#ff8a3d" stroke-width="1.3" opacity="0.55"/>
  <path d="M40 118 L84 70 L128 118" stroke="#ff8a3d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 106 L84 74 L116 106" stroke="#ff8a3d" stroke-width="1.35" opacity="0.45"/>
  <path d="M48 118 V148 H120 V118" stroke="#ff8a3d" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- siding lines -->
  <path d="M54 128 H114 M54 136 H114" stroke="#ff8a3d" stroke-width="1.1" opacity="0.35"/>
  <!-- door -->
  <rect x="76" y="126" width="16" height="22" rx="1.5" stroke="#ff8a3d" stroke-width="2"/>
