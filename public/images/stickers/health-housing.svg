  <path d="M46 148 H122 M42 152 H126" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round"/>
  <!-- wing marks + label -->
  <path d="M28 168 H48 M32 172 H44" stroke="#ff8a3d" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <path d="M120 168 H140 M124 172 H136" stroke="#ff8a3d" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <text x="84" y="172" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" font-size="14" font-weight="700" letter-spacing="0.1em">
    <tspan fill="#fe3a3a">H</tspan><tspan fill="#ff8a3d">OUSING</tspan>
